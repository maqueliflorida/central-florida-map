<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Interativo · Central Flórida</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<style>
/* ============================================================
   TOKENS — mude aqui pra mudar a cara do mapa inteiro
   ============================================================ */
:root{
  --rosa:#ff5f7e; --pessego:#f7c68b; --coral:#ff7f50; --roxo:#7b68ee;
  --grad:linear-gradient(118deg,#ff7185 0%,#f6c68b 100%);
  --tinta:#221d29; --tinta2:#5f5869; --tinta3:#938c9d;
  --papel:#fff; --fundo:#f3f1f4; --linha:#e9e5eb; --linha2:#f2eff4;
  --sombra:0 1px 2px rgba(34,29,41,.05), 0 14px 38px rgba(34,29,41,.11);
  --sombra-sm:0 1px 2px rgba(34,29,41,.06), 0 4px 12px rgba(34,29,41,.07);
  --r:14px; --r-sm:10px;
  --menu:210px; --painel:420px; --respiro:28px;
  /* a coluna da região é 14% mais estreita que a do condomínio */
  --painel-reg:397px;
  /* proporção da foto do condomínio; a da região é calculada pra dar a MESMA
     altura, já que as duas colunas têm larguras diferentes */
  --prop-foto:16/9;
  --ease:cubic-bezier(.22,.7,.28,1);
}

/* ============================================================
   BASE — box-sizing global e disciplina anti-vazamento
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; display:flex; overflow:hidden;
  font-family:'Outfit','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
  font-size:17.5px; line-height:1.45; color:var(--tinta); background:var(--fundo);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;padding:0;background:none;cursor:pointer;}
a{color:inherit;}
img{display:block;max-width:100%;}
h1,h2,h3,h4,p,ul{margin:0;}
ul{list-style:none;padding:0;}
/* nada de texto estourando caixa, em lugar nenhum */
h1,h2,h3,h4,p,li,span,a,button{overflow-wrap:anywhere;}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#d8d2dc;border-radius:9px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#c2bac8;background-clip:content-box;}

/* ============================================================
   MENU DE REGIÕES
   ============================================================ */
#menu{
  width:var(--menu); flex:0 0 var(--menu); min-width:0;
  background:var(--papel); border-right:1px solid var(--linha);
  display:flex; flex-direction:column; z-index:6;
}
#menu-topo{padding:16px 14px 10px;}
#menu-topo h1{font-size:18.75px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
#menu-topo p{font-size:14.38px;color:var(--tinta3);margin-top:2px;}
.busca{position:relative;margin:10px 14px 8px;}
.busca input{
  width:100%; padding:8px 10px 8px 30px; font:inherit; font-size:15.62px;
  border:1px solid var(--linha); border-radius:9px; background:var(--fundo); color:var(--tinta);
}
.busca input::placeholder{color:var(--tinta3);}
.busca svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:var(--tinta3);pointer-events:none;}
#lista{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 10px;}
.item{
  width:100%; display:flex; align-items:center; gap:8px; min-width:0;
  padding:8px 9px; margin-bottom:2px; border-radius:9px; text-align:left;
  transition:background .14s;
}
.item:hover{background:var(--linha2);}
.item[aria-current="true"]{background:var(--grad);color:#fff;box-shadow:var(--sombra-sm);}
.item-txt{min-width:0;flex:1;}
.item-nome{display:block;font-size:15.62px;font-weight:600;line-height:1.25;}
.item-sub{display:block;font-size:13.12px;color:var(--tinta3);line-height:1.3;margin-top:1px;}
.item[aria-current="true"] .item-sub{color:rgba(255,255,255,.85);}
.item-vazio{font-size:13.75px;color:var(--tinta3);padding:10px 9px;}
#menu-rodape{padding:8px 10px 12px;border-top:1px solid var(--linha);display:flex;gap:6px;}
.parque{
  flex:1; min-width:0; padding:8px 6px; border-radius:9px; font-size:13.75px; font-weight:600;
  color:#fff; display:flex; align-items:center; justify-content:center; gap:5px;
  transition:filter .14s,transform .14s;
}
.parque:hover{filter:brightness(1.08);transform:translateY(-1px);}
.parque img{height:14px;width:auto;flex:none;}
.p-disney{background:var(--roxo);}
.p-universal{background:#2c2b46;}

/* ============================================================
   PALCO / MAPA
   ============================================================ */
#palco{flex:1;min-width:0;position:relative;}
#map{position:absolute;inset:0;}
.mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{font-size:12.5px;}

.controles{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:8px;}
.ctrl{
  height:34px; padding:0 14px; border-radius:10px; background:var(--papel);
  box-shadow:var(--sombra-sm); font-size:15.62px; font-weight:600; color:var(--tinta);
  display:flex; align-items:center; gap:6px; transition:transform .14s;
}
.ctrl:hover{transform:translateY(-1px);}
.ctrl svg{width:14px;height:14px;fill:currentColor;flex:none;}
a.ctrl{text-decoration:none;}

/* selo de direitos: continua a barra de atribuição do Mapbox, no canto inferior
   direito. A atribuição do Mapbox continua visível ao lado — é exigência da
   licença deles e não pode ser escondida. */
.mapboxgl-ctrl-bottom-right{display:flex;flex-direction:row;align-items:flex-end;}
#selo-direitos{
  background:var(--rosa); color:#fff; font-size:12.5px; line-height:1.25;
  padding:3px 9px; margin:0; max-width:52vw;
}
.zoom{position:absolute;bottom:34px;right:14px;z-index:5;display:flex;flex-direction:column;
      border-radius:10px;overflow:hidden;box-shadow:var(--sombra-sm);background:var(--papel);}
.zoom button{width:34px;height:34px;font-size:21.25px;font-weight:500;color:var(--tinta2);display:grid;place-items:center;}
.zoom button:first-child{border-bottom:1px solid var(--linha);}
.zoom button:hover{background:var(--linha2);}

/* dica de zoom no iframe */
#dica{
  position:absolute; inset:0; z-index:7; display:none; place-items:center;
  background:rgba(34,29,41,.42); color:#fff; font-size:18.75px; font-weight:600;
  text-align:center; padding:20px; pointer-events:none;
}
#dica.on{display:grid;}
#selo-previa{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:8;
  background:#fdf3dc;color:#7a5a08;padding:7px 15px;border-radius:20px;
  font-size:12.5px;font-weight:600;box-shadow:var(--sombra-sm);white-space:nowrap;}

/* pins e rótulos do mapa
   ATENÇÃO: o Mapbox posiciona o marcador com transform no elemento raiz.
   Por isso todo marcador é um <div> nu e a animação mora sempre no filho. */
.pin{display:block;transform-origin:50% 100%;transition:transform .2s var(--ease);}
.pin img{width:27px;height:auto;filter:drop-shadow(0 3px 5px rgba(34,29,41,.35));}
.pin-nome{
  position:absolute; bottom:100%; left:50%; transform:translate(-50%,-4px) scale(.9);
  background:var(--papel); color:var(--tinta); font-size:14.38px; font-weight:600;
  padding:3px 9px; border-radius:20px; white-space:nowrap; box-shadow:var(--sombra-sm);
  opacity:0; transition:opacity .18s,transform .18s var(--ease); pointer-events:none;
}
.pin:hover,.pin.ativo{transform:scale(1.28);}
.pin:hover .pin-nome,.pin.ativo .pin-nome{opacity:1;transform:translate(-50%,-6px) scale(1);}
.pin.ativo img{filter:drop-shadow(0 4px 8px rgba(255,95,126,.55));}
.selo{
  display:flex; align-items:center; gap:6px; padding:4px 11px; border-radius:20px;
  color:#fff; font-size:15px; font-weight:700; white-space:nowrap;
  box-shadow:0 3px 10px rgba(34,29,41,.25); pointer-events:none;
}
.selo img{height:15px;width:auto;}
.selo-regiao{background:var(--coral);}
.selo-disney{background:var(--roxo);animation:pula 2.4s infinite var(--ease);}
.selo-universal{background:none;box-shadow:none;padding:0;}
.selo-universal img{height:38px;filter:drop-shadow(0 3px 6px rgba(34,29,41,.3));animation:pula 2.4s infinite var(--ease);}
@keyframes pula{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.06);}}

/* ============================================================
   PAINÉIS — a regra de ouro: cabeçalho fixo + corpo com rolagem
   ============================================================ */
.painel{
  position:absolute; top:0; bottom:0; width:var(--painel); z-index:4;
  background:var(--papel); box-shadow:var(--sombra);
  display:flex; flex-direction:column; min-width:0;
  transform:translateX(-102%); opacity:0; visibility:hidden;
  transition:transform .42s var(--ease), opacity .3s, visibility .42s;
}
.painel.aberto{transform:none;opacity:1;visibility:visible;}
#painelRegiao{left:0;width:var(--painel-reg);}
#painelCondo{left:var(--painel-reg);z-index:3;}
/* barra de rolagem escondida de propósito: ela comia 9px de largura só quando
   aparecia, e aí a foto do condomínio ficava 5px mais baixa que a da região.
   Sem ela os dois painéis têm sempre a mesma largura. A rolagem segue normal
   por roda, trackpad e toque. */
.corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;}
.corpo::-webkit-scrollbar{display:none;}
/* a capa e a galeria rolam junto com o conteúdo, como no card original;
   só os botões ficam flutuando por cima do painel */
.painel > .fechar,.painel > .voltar{position:absolute;z-index:6;}

.fechar{
  position:absolute; top:12px; right:12px; z-index:3; width:32px; height:32px;
  border-radius:50%; background:rgba(255,255,255,.92); color:var(--tinta);
  display:grid; place-items:center; box-shadow:var(--sombra-sm);
  transition:transform .16s,background .16s;
}
.fechar:hover{transform:scale(1.09);background:#fff;}
.fechar svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;}

/* --- capa: a foto + a onda branca recortadas do próprio JPEG que já está no ar.
   A fração do recorte vem de dados.json (corteFoto), medida imagem por imagem. --- */
/* UM gradiente só. A foto fica POR CIMA dele e é recortada pela curva da onda,
   então não existe emenda entre dois gradientes — não tem como aparecer linha.
   O traço branco é desenhado por cima da borda do recorte. */
/* margem negativa amarrada ao mesmo respiro do bloco: a foto sangra de ponta a ponta */
.capa{position:relative;flex:none;margin:0 calc(var(--respiro) * -1);}
/* o recorte vai na CAIXA visível, não na <img>: objectBoundingBox usa a caixa
   do elemento, e a imagem é muito mais alta do que a janela que mostramos dela */
/* fundo branco: a caixa já ocupa o lugar certo antes da foto chegar, em vez de
   deixar o gradiente aparecendo e "pulando" quando a imagem entra */
.capa-corte{overflow:hidden;position:relative;background:#fff;}
/* indicador de carregamento: anel girando no meio da área branca. A classe sai
   quando a imagem termina — ou falha, pra não ficar girando pra sempre. */
.capa-corte.carregando::after{
  content:"";position:absolute;z-index:1;
  top:50%;left:50%;width:28px;height:28px;margin:-14px 0 0 -14px;
  border:3px solid #eceaef;border-top-color:var(--rosa);border-radius:50%;
  animation:giraCapa .7s linear infinite;
}
@keyframes giraCapa{to{transform:rotate(360deg);}}
.capa.com-onda .capa-corte{clip-path:url(#ondaCorte);}
/* object-fit:cover faz nativamente o que o cálculo de zoom fazia na mão: encaixa a
   foto na caixa sem deixar buraco e sem deformar, centralizada nos dois eixos.
   Foto no formato da caixa aparece inteira; foto mais alta aparece como uma faixa
   do meio dela. Sem número pra calibrar por foto — funciona pra qualquer formato. */
/* cover = preenche a caixa inteira sem deformar. O scale por cima é o zoom
   opcional do admin; a origem é a MESMA da posição, senão dar zoom "puxaria"
   a foto pro centro e desfaria o ajuste das setas. */
.capa-corte img{position:absolute;inset:0;width:100%;height:100%;max-width:none;
  object-fit:cover;object-position:var(--pos-capa,center top);display:block;
  transform:scale(var(--zoom-capa,1));transform-origin:var(--pos-capa,center top);}
.onda-fio{position:absolute;inset:0;z-index:2;pointer-events:none;}
.onda-fio svg{width:100%;height:100%;display:block;}
/* topo.png: colada ao topo do .grad-conteudo (= rodapé da foto), sobrepondo a
   foto por cima. A parte vazada (topo do PNG) deixa a foto aparecer; só a onda
   opaca embaixo cobre o canto — e a cor dela é a mesma do gradiente logo abaixo. */
.topo-onda{position:absolute;left:0;right:0;bottom:0;z-index:2;line-height:0;pointer-events:none;}
.topo-onda img{width:100%;height:auto;max-width:none;display:block;}

/* ── bloco em gradiente ──────────────────────────────────────────────────
   Hierarquia: caixa-alta é reservado só pros rótulos pequenos. O nome e os
   destaques ficam em caixa normal, que lê melhor e pesa menos. */
/* Faixa presa no topo com o nome da região. Fica FORA do .corpo, absoluta sobre
   o painel: assim não empurra o conteúdo nem some junto com o gradiente que rola.
   Entra em cena quando o título do card passa pelo topo da coluna. */
.barra-reg{
  position:absolute; top:0; left:0; right:0; z-index:5;
  display:flex; align-items:baseline; gap:9px; min-width:0;
  /* 14,2px em cima e embaixo: +15% de altura (49 -> 56px) com o texto centrado
     na vertical. Laterais intocadas, o texto não anda pros lados. */
  padding:14.2px 56px 14.2px var(--respiro);   /* direita livre pro botão de fechar */
  background:linear-gradient(to right,#ff7686 0%,#f6ca8b 100%);
  box-shadow:0 2px 12px rgba(34,29,41,.18);
  transform:translateY(-100%); opacity:0; pointer-events:none;
  transition:transform .26s var(--ease), opacity .2s;
}
.barra-reg.on{transform:none; opacity:1;}
.barra-reg b{
  font-size:19px; font-weight:700; letter-spacing:-.02em; color:#fff;
  min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.barra-reg span{
  flex:none; font-size:10.5px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:rgba(255,255,255,.8);
}

.grad{
  background:linear-gradient(to right,#ff7686 0%,#f6ca8b 100%);
  color:#fff; padding:0 var(--respiro) 13px; min-width:0;
}
.grad-conteudo{padding-top:3px;}   /* 17px menos 14px: nome e o resto do bloco sobem 14px */

.condado{
  text-align:left; margin-top:2px;
  font-size:11.88px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:rgba(255,255,255,.78);
}
.grad h2{
  font-size:32.3px; font-weight:700; line-height:.98; letter-spacing:-.03em;
  text-wrap:balance; color:#fff;
}
.grad .resumo{
  margin-top:10px; font-size:16.25px; font-weight:500; line-height:1.4;
  color:rgba(255,255,255,.9);
}
.risca{height:1px;background:rgba(255,255,255,.28);margin:6px 0;border:0;}

/* destaques */
.bullets{display:flex;flex-direction:column;gap:1px;margin-top:17px;}
.bullets li{
  display:flex; gap:9px; align-items:baseline; min-width:0;
  font-size:16.88px; font-weight:500; line-height:1.2; color:rgba(255,255,255,.97);
}
.bullets li::before{
  content:"-"; flex:none; font-weight:600; color:rgba(255,255,255,.8);
}

/* os números — 2 colunas no painel estreito, 3 quando ele é largo */
.numeros{margin-top:17px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;
  background:rgba(255,255,255,.22);border-radius:4px;overflow:hidden;}
.num{min-width:0;padding:6px 12px;background:rgba(255,255,255,.035);}
.num b{display:block;font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1;color:#fff;}
.num b em{font-style:normal;font-size:13px;font-weight:600;margin-left:1px;color:rgba(255,255,255,.8);}
.num span{
  display:block; margin-top:3px; font-size:9.56px; font-weight:600; line-height:1.15;
  letter-spacing:.11em; text-transform:uppercase; color:rgba(255,255,255,.76);
}

@media (max-width:560px){
  .numeros{grid-template-columns:repeat(2,minmax(0,1fr));}
}

/* --- faixa "CONHEÇA OS MELHORES CONDOMÍNIOS DESSA REGIÃO" --- */
.faixa{display:flex;align-items:stretch;min-width:0;background:linear-gradient(90deg,#fea6a5 0%,#f9d4a8 100%);}
.faixa i{flex:none;width:56px;display:grid;place-items:center;background:#fecbd2;}
.faixa i svg{width:19px;height:19px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.faixa p{
  flex:1; min-width:0; padding:13px 16px;
  font-size:15.62px; font-weight:500; letter-spacing:.025em; line-height:1.22;
  text-transform:uppercase; color:#fff;
}

/* --- linhas de condomínio: foto grande à esquerda, texto à direita --- */
.linha{
  display:flex; align-items:stretch; min-width:0; width:100%; text-align:left;
  background:var(--papel); border-bottom:1px solid #eceaee; transition:background .16s;
  min-height:94px;   /* piso, pra foto nunca virar uma tira */
}
.linha:hover,.linha.ativo{background:#fdf5f6;}
.linha.ativo{box-shadow:inset 4px 0 0 var(--rosa);}
/* a foto é absoluta: assim a altura da linha vem SÓ do texto. Antes ela
   entrava no cálculo pela proporção natural e segurava linhas curtas. */
.linha-foto{flex:none;width:46.4%;align-self:stretch;overflow:hidden;background:var(--fundo);position:relative;}
.linha-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* altura do card 15% menor: o corte sai dos respiros e do entrelinhas.
   Os corpos de texto ficam como estão — foram calibrados em +25%. */
.linha-txt{flex:1;min-width:0;padding:5px 17px;display:flex;flex-direction:column;justify-content:center;gap:1px;}
.linha-nome{font-size:18.7px;font-weight:600;line-height:1;color:#f89b7f;text-wrap:balance;margin-bottom:0;}
.linha-chamadas{
  font-size:12.65px; font-weight:500; letter-spacing:.015em; line-height:1.15;
  color:#2b2b2b;
}
.linha-preco{margin-top:0;text-align:right;min-width:0;}
.linha-preco small{
  display:block; font-size:9.9px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:#2b2b2b;
}
.linha-preco b{
  display:block; margin-top:0; font-size:15.2px; font-weight:700;
  letter-spacing:-.015em; line-height:1.05; color:#2b2b2b;
}
.linha-meta{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:0;min-width:0;}
.linha-meta span{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%;font-size:11.55px;font-weight:500;color:#9a93a3;}
/* nome de construtora longo corta com reticências em vez de empurrar a linha */
.linha-meta i{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.linha-meta svg{width:11px;height:11px;flex:none;stroke:#bdb6c5;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* --- seções brancas (extras da região e painel do condomínio) --- */
.secao{padding:18px 22px;border-bottom:1px solid var(--linha2);min-width:0;}
.secao:last-child{border-bottom:0;}
.secao-tit{
  font-size:13.12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--tinta3); margin-bottom:12px; display:flex; align-items:center; gap:7px;
}
.secao-tit::after{content:"";flex:1;height:1px;background:var(--linha);min-width:8px;}
/* com botão na linha, o filete vira elemento de verdade: o ::after renderiza
   sempre por último e empurraria o botão pra esquerda */
.secao-tit.com-bt::after{display:none;}
.secao-tit .risca-tit{flex:1;height:1px;background:var(--linha);min-width:8px;}

.chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{font-size:11.88px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--linha2);color:var(--tinta2);white-space:nowrap;}

/* escolas / custos / lugares — listas de duas colunas */
.pares{display:flex;flex-direction:column;gap:7px;}
.par{display:flex;align-items:center;gap:9px;min-width:0;font-size:15.62px;}
.par > span:first-child{flex:1;min-width:0;color:var(--tinta2);font-weight:500;}
.par > span:last-child{flex:none;font-weight:700;color:var(--tinta);white-space:nowrap;}
.par i{flex:none;height:1px;background:var(--linha);min-width:10px;width:100%;max-width:70px;}
.par small{display:block;font-size:12.5px;font-weight:500;color:var(--tinta3);}
.texto{font-size:16.25px;line-height:1.415;color:var(--tinta2);}

/* lojas mais próximas: gota vermelha, logo da marca e o tempo de carro */
.lojas{display:flex;flex-direction:column;gap:12px;}
.loja{display:flex;align-items:center;gap:11px;min-width:0;}
.loja-pin{flex:none;width:19px;height:19px;}
.loja-logo{flex:none;height:19px;width:auto;max-width:112px;object-fit:contain;}
/* ajuste fino por marca — os logos têm proporções e pesos visuais diferentes */
.loja-walmart{height:20.9px;}    /* +10% */
.loja-publix{height:17.1px;}     /* -10% */
.loja-cvs{height:15.58px;}       /* -18% */
.loja i{flex:1;height:1px;background:var(--linha);min-width:10px;}
.loja b{flex:none;font-size:15px;font-weight:700;color:var(--tinta);white-space:nowrap;}
.loja b em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--tinta3);margin-left:2px;}
.loja-nome{flex:none;font-size:14px;font-weight:600;color:var(--tinta2);white-space:nowrap;}

/* botão VER NO MAPA, encaixado na própria linha do título da seção */
.bt-mapa{
  flex:none; display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
  border-radius:4px; background:var(--linha2); color:var(--tinta2);
  font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  white-space:nowrap; transition:background .16s,color .16s;
}
.bt-mapa:hover{background:var(--rosa);color:#fff;}
.bt-mapa svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.bt-mapa.ativo{background:var(--rosa);color:#fff;}

/* pins das lojas no mapa — uma cor por marca */
.pin-loja{display:block;position:relative;transform-origin:50% 100%;transition:transform .2s var(--ease);}
.pin-loja svg{width:30px;height:30px;display:block;filter:drop-shadow(0 3px 5px rgba(34,29,41,.4));}
.pin-loja:hover{transform:scale(1.15);}
/* chip branco com o logo, sempre visível em cima do alfinete */
.pin-loja .chip-loja{
  position:absolute; bottom:100%; left:50%; transform:translate(-50%,-4px);
  background:var(--papel); border-radius:4px; padding:3.6px 7.2px;
  box-shadow:var(--sombra-sm); pointer-events:none;
}
/* max-width:none: o chip é shrink-to-fit, e o img{max-width:100%} global
   resolveria contra uma largura que depende da própria imagem — colapsa */
.pin-loja .chip-loja img{display:block;height:15.6px;width:auto;max-width:none;}
.pin-loja .chip-loja b{display:block;font-size:13.8px;font-weight:700;color:var(--tinta);white-space:nowrap;}
/* mesmo ajuste por marca do card: os logos têm pesos visuais diferentes */
.chip-walmart img{height:17.16px;}   /* +10% */
.chip-publix img{height:14.04px;}    /* -10% */
.chip-cvs img{height:12.79px;}       /* -18% */
.tempo-loja{background:var(--papel);border:1.8px solid currentColor;border-radius:20px;padding:2.4px 9.6px;font-size:15px;font-weight:700;white-space:nowrap;box-shadow:var(--sombra-sm);}

/* estado "região sem condomínio cadastrado" */
.aviso{background:var(--fundo);border-radius:var(--r);padding:20px;text-align:center;margin:18px 22px;}
.aviso svg{width:26px;height:26px;margin:0 auto 9px;stroke:var(--tinta3);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.aviso p{font-size:15.62px;color:var(--tinta2);line-height:1.45;}
.aviso a{display:inline-block;margin-top:13px;padding:10px 19px;border-radius:9px;background:var(--grad);color:#fff;font-size:15.62px;font-weight:700;text-decoration:none;}

/* ============================================================
   PAINEL DO CONDOMÍNIO
   ============================================================ */
.galeria{position:relative;flex:none;aspect-ratio:var(--prop-foto);background:var(--fundo);overflow:hidden;}
/* capa provisória: a foto da região recortada. Precisa desfazer o que
   .galeria img impõe às fotos da galeria — absoluta, esticada e invisível. */
.galeria.provisoria{background:none;}
.galeria.provisoria .capa-corte{aspect-ratio:var(--prop-foto);}
.galeria.provisoria .capa-corte img{position:static;opacity:1;object-fit:initial;width:var(--zoom,100%);max-width:none;height:auto;display:block;margin-left:calc((100% - var(--zoom,100%)) / 2);}
.galeria img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .55s ease;}
.galeria img.on{opacity:1;}
.galeria-pontos{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
.galeria-pontos button{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:width .2s,background .2s;}
.galeria-pontos button.on{width:17px;border-radius:20px;background:#fff;}
.voltar{
  position:absolute;top:12px;left:12px;z-index:3;height:32px;padding:0 13px 0 9px;border-radius:20px;
  background:rgba(255,255,255,.92);box-shadow:var(--sombra-sm);display:none;align-items:center;gap:5px;
  font-size:15px;font-weight:600;
}
.voltar svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.condo-cabeca{padding:18px 20px 14px;border-bottom:1px solid var(--linha2);}
.condo-cabeca h2{font-size:28.75px;font-weight:800;letter-spacing:-.022em;line-height:1.1;text-wrap:balance;}
.condo-cabeca .local{display:flex;align-items:center;gap:5px;font-size:14.38px;color:var(--tinta3);margin-top:4px;font-weight:500;min-width:0;}
.condo-cabeca .local svg{width:13px;height:13px;flex:none;stroke:var(--tinta3);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
/* tipos de imóvel, com o ✅ do card original */
/* chips lado a lado; wrap só como rede de segurança se alguém cadastrar
   um tipo muito longo — com os três atuais eles cabem numa linha só */
.tipos{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px;min-width:0;}
.tipos li{
  padding:5px 10px; border-radius:3px; background:var(--linha2);
  font-size:12.5px; font-weight:600; letter-spacing:.01em;
  color:var(--tinta2); white-space:nowrap;
}
.condo-linha1{display:flex;align-items:flex-start;gap:16px;min-width:0;}
.condo-id{flex:1;min-width:0;}
.preco-linha{flex:none;text-align:right;min-width:0;}
.preco-linha span{display:block;font-size:9.5px;line-height:1;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3);}
.preco-linha b{display:block;font-size:32.5px;font-weight:800;letter-spacing:-.03em;color:var(--rosa);line-height:1;margin-top:0;}

.chamadas{display:flex;flex-direction:column;gap:4px;margin-top:18px;}
.chamadas li{display:flex;gap:8px;align-items:flex-start;font-size:15.62px;font-weight:600;color:var(--tinta2);min-width:0;}
.chamadas svg{flex:none;width:15px;height:15px;margin-top:1px;fill:var(--rosa);}


/* plantas */
.plantas{display:flex;flex-direction:column;gap:7px;}
.planta{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;border-radius:var(--r-sm);background:var(--fundo);}
.planta-nome{flex:1;min-width:0;font-size:15.62px;font-weight:700;line-height:1.25;}
.planta-specs{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:13.75px;color:var(--tinta2);font-weight:500;min-width:0;}
.planta-specs span{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.planta-specs svg{width:12px;height:12px;stroke:var(--tinta3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.planta-preco{flex:none;font-size:15px;font-weight:700;color:var(--rosa);white-space:nowrap;}

/* ficha técnica */
.ficha{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.ficha div{min-width:0;padding:10px 12px;border-radius:var(--r-sm);background:var(--fundo);}
.ficha dt{font-size:11.88px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta3);}
.ficha dd{margin:3px 0 0;font-size:16.25px;font-weight:600;line-height:1.3;}
.ficha .largo{grid-column:1 / -1;}

/* comodidades */
.comodidades{display:flex;flex-wrap:wrap;gap:6px;}
.comodidade{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:var(--fundo);font-size:14.38px;font-weight:600;color:var(--tinta2);min-width:0;}
.comodidade svg{width:13px;height:13px;flex:none;stroke:var(--rosa);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}


/* rodapé grudado com o CTA */
.rodape{flex:none;padding:12px 16px;border-top:1px solid var(--linha);display:flex;gap:8px;background:var(--papel);}
.cta{
  flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:12px 14px; border-radius:11px; background:#25D366; color:#fff;
  font-size:16.88px; font-weight:700; text-decoration:none; transition:filter .16s,transform .16s;
}
.cta:hover{filter:brightness(1.06);transform:translateY(-1px);}
.cta svg{width:17px;height:17px;fill:currentColor;flex:none;}
.btn-video{
  flex:none; display:flex; align-items:center; gap:6px; padding:12px 15px; border-radius:11px;
  background:var(--grad); color:#fff; font-size:16.25px; font-weight:700; transition:filter .16s,transform .16s;
}
.btn-video:hover{filter:brightness(1.06);transform:translateY(-1px);}
.btn-video svg{width:13px;height:13px;fill:currentColor;flex:none;}

/* ============================================================
   RAIO-X COMPLETO (tela cheia + PDF)
   ============================================================ */
.chip-raiox{
  display:inline-flex; align-items:center; gap:7px; margin-top:13px;
  padding:8px 14px; border-radius:4px; background:rgba(255,255,255,.22);
  color:#fff; font-size:12.5px; font-weight:700; letter-spacing:.02em;
  transition:background .16s,transform .16s;
}
.chip-raiox:hover{background:rgba(255,255,255,.34);transform:translateY(-1px);}
.chip-raiox svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

#raioX{position:fixed;inset:0;z-index:70;background:var(--fundo);display:flex;flex-direction:column;}
#raioX[hidden]{display:none;}
.rx-barra{
  flex:none; display:flex; align-items:center; gap:12px; min-width:0;
  padding:14px 22px; background:var(--papel); border-bottom:1px solid var(--linha);
}
.rx-barra b{flex:1;min-width:0;font-size:19px;font-weight:700;letter-spacing:-.015em;}
.rx-pdf{
  flex:none; display:flex; align-items:center; gap:7px; padding:9px 16px;
  border-radius:9px; background:var(--grad); color:#fff; font-size:13px; font-weight:700;
  transition:filter .16s,transform .16s;
}
.rx-pdf:hover{filter:brightness(1.06);transform:translateY(-1px);}
.rx-pdf svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.rx-fechar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--fundo);
  color:var(--tinta2);display:grid;place-items:center;transition:background .16s;}
.rx-fechar:hover{background:var(--linha);}
.rx-fechar svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;}

.rx-corpo{flex:1;min-height:0;overflow-y:auto;padding:26px 22px 60px;}
.rx-folha{max-width:760px;margin:0 auto;background:var(--papel);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sombra);}
/* dentro da folha o bloco fica mais largo: os números cabem em 3 colunas
   e os condomínios ganham foto maior */
.rx-folha .numeros{grid-template-columns:repeat(3,minmax(0,1fr));}
.rx-folha .grad{padding:0 34px 32px;}
.rx-folha .grad-conteudo{padding-top:22px;}
.rx-folha .capa{margin:0 -34px;}
.rx-folha .capa-corte{aspect-ratio:21/9;position:relative;}
.rx-folha .linha-foto{width:38%;}

@media print{
  body > *:not(#raioX){display:none !important;}
  #raioX{position:static;background:#fff;}
  .rx-barra{display:none;}
  .rx-corpo{overflow:visible;padding:0;}
  .rx-folha{max-width:none;box-shadow:none;border-radius:0;}
  .linha{break-inside:avoid;}
}

/* ============================================================
   GALERIA EM TELA CHEIA
   ============================================================ */
.tem-lupa{cursor:zoom-in;}
.gc-abrir{
  position:absolute; right:12px; bottom:12px; z-index:3; width:36px; height:36px;
  border-radius:9px; background:rgba(24,18,28,.55); color:#fff; display:grid;
  place-items:center; backdrop-filter:blur(3px); transition:background .16s,transform .16s;
}
.gc-abrir:hover{background:rgba(24,18,28,.78);transform:scale(1.06);}
.gc-abrir svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}

#galeriaCheia{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:20px;
  background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
}
#galeriaCheia[hidden]{display:none;}

/* a caixa encolhe até a largura da foto, então o topo, as setas e a tira
   ficam todos ancorados nela em vez de nas bordas da tela */
.gc-caixa{display:flex;flex-direction:column;max-width:100%;max-height:100%;min-width:0;}
/* faixa branca colada no topo da foto: nome e cidade à esquerda, preço à direita */
.gc-topo{
  flex:none; display:flex; align-items:center; gap:18px; min-width:0;
  background:#fff; border-radius:8px 8px 0 0; padding:13px 16px 13px 18px;
  color:var(--tinta);
}
.gc-id{flex:1;min-width:0;}
.gc-id b{display:block;font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.15;}
.gc-id span{display:block;margin-top:2px;font-size:12.5px;font-weight:500;color:var(--tinta3);}
.gc-preco{flex:none;text-align:right;min-width:0;}
.gc-preco span{display:block;font-size:9.5px;line-height:1;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tinta3);}
.gc-preco b{display:block;margin-top:3px;font-size:21px;font-weight:800;letter-spacing:-.03em;
  line-height:1;color:var(--rosa);}
.gc-preco[hidden]{display:none;}
.gc-contador{flex:none;font-size:13.75px;font-weight:600;color:var(--tinta3);}
.gc-fechar{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(34,29,41,.1);
  color:var(--tinta);display:grid;place-items:center;transition:background .16s,transform .16s;}
.gc-fechar:hover{background:rgba(34,29,41,.2);transform:scale(1.07);}
.gc-fechar svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;}

.gc-palco{flex:none;position:relative;display:flex;justify-content:center;min-width:0;}
/* o tamanho sai de dimensionaFoto(): 125% do arquivo, ou o que couber, o que for menor */
.gc-palco img{display:block;border-radius:0 0 8px 8px;box-shadow:0 18px 50px rgba(34,29,41,.3);}
.gc-video{border-radius:0 0 8px 8px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(34,29,41,.3);}
.gc-video[hidden]{display:none;}
.gc-video iframe{display:block;width:100%;height:100%;border:0;}
/* miniatura de vídeo ganha o losango de play */
.gc-tira button.video{position:relative;}
.gc-tira button.video::after{
  content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:0; height:0; border-left:13px solid #fff; border-top:8px solid transparent;
  border-bottom:8px solid transparent; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
}
.gc-nav{
  position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px;
  border-radius:50%; background:rgba(34,29,41,.12); color:var(--tinta); display:grid;
  place-items:center; transition:background .16s;
}
.gc-nav:hover{background:rgba(34,29,41,.26);}
.gc-nav svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.gc-ant{left:-54px;} .gc-prox{right:-54px;}

.gc-tira{flex:none;display:flex;justify-content:center;gap:8px;overflow-x:auto;
  padding-top:10px;scrollbar-width:none;}
.gc-tira::-webkit-scrollbar{display:none;}
.gc-tira button{flex:none;width:84px;height:56px;border-radius:5px;overflow:hidden;
  opacity:.5;transition:opacity .16s,box-shadow .16s;}
.gc-tira button:hover{opacity:.85;}
.gc-tira button.on{opacity:1;box-shadow:0 0 0 2px var(--rosa);}
.gc-tira img{width:100%;height:100%;object-fit:cover;}

/* sem espaço de sobra nas laterais, as setas entram por cima da foto */
@media (max-width:760px){
  .gc-ant{left:8px;} .gc-prox{right:8px;}
  .gc-nav{width:38px;height:38px;background:rgba(255,255,255,.82);}
  .gc-tira button{width:66px;height:46px;}
  .gc-id b{font-size:16px;}
  .gc-contador{display:none;}
  .gc-topo{gap:12px;padding:11px 12px 11px 14px;}
}

/* ============================================================
   LIGHTBOX DE VÍDEO
   ============================================================ */
#lightbox{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:24px;background:rgba(24,18,28,.78);}
#lightbox.on{display:grid;}
#lightbox .moldura{position:relative;width:min(960px,100%);aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);}
#lightbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
#lightbox .fechar{top:-42px;right:0;background:rgba(255,255,255,.14);color:#fff;}
#lightbox .fechar:hover{background:rgba(255,255,255,.26);}

/* ============================================================
   RESPONSIVO
   ============================================================ */
/* Abaixo de 1280px os dois painéis lado a lado espremeriam o mapa:
   o do condomínio passa a cobrir o da região, com botão Voltar. */
@media (max-width:1280px){
  #painelCondo{left:0;z-index:5;}
  #painelCondo .voltar{display:flex;}
  #painelCondo .fechar{display:none;}
}
/* COMPACTO — celular e iframe estreito */
@media (max-width:900px){
  :root{--painel:100%;--painel-reg:100%;}
  body{flex-direction:column;}
  #menu{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--linha);}
  #menu-topo{padding:12px 14px 8px;}
  .busca{margin:0 14px 8px;}
  #lista{flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 14px 10px;scrollbar-width:none;}
  #lista::-webkit-scrollbar{display:none;}
  .item{width:auto;flex:none;margin:0;padding:7px 13px;}
  .item-sub{display:none;}
  #menu-rodape{padding:0 14px 10px;border-top:0;}
  #palco{flex:1;min-height:0;}
  #painelCondo{left:0;z-index:5;}
  .painel .voltar{display:flex;}
  #painelCondo .fechar{display:none;}
  .controles{top:10px;right:10px;}
  /* no celular o painel ocupa a tela toda: o Reiniciar bateria no ✕ do painel */
  body.painel-aberto .controles{display:none;}
  .zoom{display:none;}
  .hero-corte{aspect-ratio:16/7;}
  .hero-corte img{margin-top:-2%;}
}
@media (max-width:420px){
  /* espaço apertado: o botão novo fica só com o ícone, pra não empurrar o Reiniciar */
  #btNovaJanela span{display:none;}
  #btNovaJanela{padding:0 11px;}
  /* e o selo de direitos encolhe pra cobrir menos mapa */
  #selo-direitos{font-size:11px;padding:3px 7px;max-width:64vw;}
  .numeros{grid-template-columns:repeat(2,minmax(0,1fr));}
  .ficha{grid-template-columns:minmax(0,1fr);}
  .rodape{flex-wrap:wrap;}
  .btn-video{flex:1;justify-content:center;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>

<aside id="menu">
  <div id="menu-topo">
    <h1>Central Flórida</h1>
    <p>Escolha uma região no mapa</p>
  </div>
  <div class="busca">
    <svg viewBox="0 0 24 24"><path d="M11 3a8 8 0 105.3 14l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0011 3zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
    <input id="busca" type="search" placeholder="Buscar região…" autocomplete="off" aria-label="Buscar região">
  </div>
  <nav id="lista" aria-label="Regiões"></nav>
  <div id="menu-rodape">
    <button class="parque p-disney" data-parque="disney">
      <img src="" alt="" id="icone-mickey"><span>Disney</span>

       falhou. O carimbo de tempo faz o navegador tratar como endereço novo. */
    const enderecoDados = CONFIG.dados + (CONFIG.dados.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
    const r = await fetch(enderecoDados, {cache:'no-cache'});
    if(r.ok){
      const j = await r.json();
      if(j && Array.isArray(j.regioes) && j.regioes.length) return j;
    }
    console.warn('dados.json indisponível; usando a cópia embutida.');
  }catch(e){
    console.warn('dados.json falhou ('+e.message+'); usando a cópia embutida.');
  }
  return JSON.parse($('#dados-embutidos').textContent);
}

/* ============================================================
   AUTO-ROLAGEM NA BORDA — aproxima o mouse do topo ou da base de uma coluna
   rolável e ela rola sozinha enquanto houver mais conteúdo naquela direção.
   Uma função só, usada nas três colunas do mapa: o menu de regiões e os
   dois painéis — cada um chama isto depois de montar o próprio conteúdo.
   ============================================================ */
function ligaAutoRolagem(alvo){
  if(!alvo) return;
  const ZONA   = 140;   /* px a partir da borda onde o mouse já puxa a rolagem — 56 × 2,5 */
  const VELMAX = 900;   /* px/s bem na borda; cai a 0 na borda da zona */
  let veloc = 0;         /* px/s atual; negativo = sobe */
  let quadro = null, ultimo = 0;

  /* px por segundo, não por quadro: assim a velocidade não depende da taxa
     de quadros do navegador (trava, tela de alta taxa, aba que acabou de
     voltar ao primeiro plano etc.) */
  const passo = agora => {
    if(!veloc){ quadro = null; return; }
    const dt = ultimo ? Math.min(agora - ultimo, 100) : 16;
    ultimo = agora;
    const antes = alvo.scrollTop;
    alvo.scrollTop += veloc * dt / 1000;
    if(alvo.scrollTop === antes){ veloc = 0; quadro = null; return; }  /* bateu no fim */
    quadro = requestAnimationFrame(passo);
  };

  alvo.addEventListener('mousemove', e => {
    const r = alvo.getBoundingClientRect();
    const distBase = r.bottom - e.clientY, distTopo = e.clientY - r.top;
    const cabeBaixo = alvo.scrollTop + alvo.clientHeight < alvo.scrollHeight - 1;
    const cabeCima  = alvo.scrollTop > 0;
    if(cabeBaixo && distBase >= 0 && distBase < ZONA)      veloc =  VELMAX * (1 - distBase / ZONA);
    else if(cabeCima && distTopo >= 0 && distTopo < ZONA)  veloc = -VELMAX * (1 - distTopo / ZONA);
    else veloc = 0;
    if(veloc && !quadro){ ultimo = 0; quadro = requestAnimationFrame(passo); }
  });
  alvo.addEventListener('mouseleave', () => { veloc = 0; });
}

function montaMenu(){

  DADOS.regioes.forEach(r => {
    const precos = r.condominios.map(c => precoEmK(c.precoBase)).filter(n => n!=null);

    b.setAttribute('aria-current','false');
    b.innerHTML =
      '<span class="item-txt">' +
        '<span class="item-nome">'+esc(r.nome)+'</span>' +
        '<span class="item-sub">'+ (precos.length
            ? r.condominios.length+' '+(r.condominios.length>1?'condomínios':'condomínio')+' · desde '+formataK(Math.min.apply(null,precos))

$('#busca').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let visiveis = 0;
  document.querySelectorAll('#lista .item').forEach(b => {
    const r = DADOS.regioes.find(x => x.id === b.dataset.regiao);
    const alvo = (r.nome+' '+(r.condado||'')+' '+r.condominios.map(c=>c.nome).join(' ')).toLowerCase();
    const ok = !q || alvo.includes(q);
    b.hidden = !ok;
    if(ok) visiveis++;
  });
  let vazio = document.querySelector('.item-vazio');
  if(!visiveis){
    if(!vazio){ vazio = el('p','item-vazio'); vazio.textContent = 'Nenhuma região encontrada.'; $('#lista').appendChild(vazio); }
  } else if(vazio) vazio.remove();
});

function marcarMenu(id){
  document.querySelectorAll('#lista .item').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.regiao === id)));
}

/* ============================================================
   MAPA
   ============================================================ */
function iniciaMapa(){
  mapboxgl.accessToken = CONFIG.token;
  window.mapa = map = new mapboxgl.Map({
    container:'map', style:CONFIG.estilo,
    center:CONFIG.centro, zoom:CONFIG.zoom, attributionControl:true
  });
  map.on('load', () => {
    desenhaParques();
    poeSeloDireitos();
    /* no iframe, rolagem só dá zoom com Ctrl — senão a página trava */
    map.scrollZoom.disable();
    const cv = map.getCanvas();
    let t = null;
    cv.addEventListener('wheel', e => {
      if(e.ctrlKey || e.metaKey){
        e.preventDefault();
        map.zoomTo(map.getZoom() + (e.deltaY < 0 ? .3 : -.3), {duration:180});
        $('#dica').classList.remove('on');
      }else{
        $('#dica').classList.add('on');
        clearTimeout(t);
        t = setTimeout(() => $('#dica').classList.remove('on'), 1100);
      }
    }, {passive:false});
  });
  map.on('error', e => console.warn('Mapbox:', e && e.error && e.error.message));
}

function camadaArea(id, anel, cor, opacidade){
  const dado = {type:'Feature', properties:{},
    geometry:{type:'Polygon', coordinates:[anel]}};
  if(map.getLayer(id)) map.removeLayer(id);
  if(map.getLayer(id+'-borda')) map.removeLayer(id+'-borda');
  if(map.getSource(id)) map.removeSource(id);
  map.addSource(id, {type:'geojson', data:dado});
  map.addLayer({id, type:'fill', source:id,
    paint:{'fill-color':cor,'fill-opacity':opacidade}});
  map.addLayer({id:id+'-borda', type:'line', source:id,
    paint:{'line-color':cor,'line-width':1.4,'line-opacity':.55}});
}

/* O Mapbox escreve transform no elemento do marcador. Qualquer transform nosso
   (hover, animação) no mesmo elemento sobrescreve a posição e joga o marcador
   pro canto do mapa — por isso todo marcador vai dentro de um <div> nu. */
function marcador(filho){
  const caixa = el('div');
  caixa.appendChild(filho);
  return caixa;
}
function selo(classe, html){
  const n = el('div','selo '+classe);
  n.innerHTML = html;
  return marcador(n);
}

function desenhaParques(){
  const p = DADOS.parques || {};
  if(p.disney && p.disney.area){
    camadaArea('area-disney', p.disney.area, '#7b68ee', .22);
    marcaDisney = new mapboxgl.Marker({element:selo('selo-disney',
      '<img src="'+CONFIG.base+'mickey2.png" alt=""><span>Disney</span>')})
      .setLngLat(centroDe(p.disney.area)).addTo(map);
  }
  if(p.universal && p.universal.area){
    marcaUniversal = new mapboxgl.Marker({element:selo('selo-universal',
      '<img src="'+CONFIG.base+'universal.png" alt="Universal Studios">'), anchor:'bottom'})
      .setLngLat(centroDe(p.universal.area)).addTo(map);
  }
}

function limpaPins(){
  pins.forEach(p => p.marca.remove());
  pins = [];
}

function desenhaPins(r){
  limpaPins();
  r.condominios.forEach((c, i) => {
    if(!c.pin) return;
    const n = el('button','pin');
    n.type = 'button';
    n.setAttribute('aria-label', c.nome);
    n.innerHTML = '<span class="pin-nome">'+esc(c.nome)+'</span>'+
                  '<img src="'+CONFIG.base+'pin.png" alt="">';
    n.addEventListener('click', ev => { ev.stopPropagation(); abrirCondo(r.id, i); });
    n.addEventListener('mouseenter', () => destacaCondo(i, true));
    n.addEventListener('mouseleave', () => destacaCondo(i, condoAtual === i));
    const marca = new mapboxgl.Marker({element:marcador(n), anchor:'bottom'})
      .setLngLat(c.pin).addTo(map);
    pins[i] = {marca:marca, no:n};
  });
}

function sinalizaPaineis(){
  document.body.classList.toggle('painel-aberto',
    painelRegiao.classList.contains('aberto') || painelCondo.classList.contains('aberto'));
}

/* quanto do mapa está tapado pelos painéis */
function folga(){
  if(window.matchMedia('(max-width:900px)').matches) return {top:0,bottom:0,left:0,right:0};
  const empilhado = window.matchMedia('(max-width:1280px)').matches;
  const regAberto = painelRegiao.classList.contains('aberto');
  const conAberto = painelCondo.classList.contains('aberto');
  let esquerda = 0;
  if(empilhado){
    /* empilhados, quem tapa o mapa é o mais largo dos dois que estiver aberto */
    esquerda = Math.max(regAberto ? painelRegiao.offsetWidth : 0,
                        conAberto ? painelCondo.offsetWidth  : 0);
  } else {
    if(regAberto) esquerda += painelRegiao.offsetWidth;
    if(conAberto) esquerda += painelCondo.offsetWidth;
  }
  return {top:20, bottom:20, left:esquerda+24, right:24};
}

function voaPara(centro, zoom){
  map.flyTo({center:centro, zoom:zoom, padding:folga(), duration:900, essential:true});
}

/* ============================================================
   PAINEL DA REGIÃO
   ============================================================ */
function abrirRegiao(id){
  const r = DADOS.regioes.find(x => x.id === id);
  if(!r) return;
  fecharCondo(true);
  regiaoAtual = r;
  marcarMenu(id);

  camadaArea('area-regiao', r.area, '#ff7f50', .126);   /* .18 menos 30% */
  if(marcaRegiao) marcaRegiao.remove();
  marcaRegiao = new mapboxgl.Marker({element:selo('selo-regiao','<span>'+esc(r.nome)+'</span>'), anchor:'bottom'})
    .setLngLat(centroDe(r.area)).addTo(map);
  desenhaPins(r);

  painelRegiao.innerHTML = htmlRegiao(r);
  painelRegiao.classList.add('aberto');
  painelRegiao.setAttribute('aria-hidden','false');
  sinalizaPaineis();
  painelRegiao.querySelector('.corpo').scrollTop = 0;
  painelRegiao.querySelector('.fechar').addEventListener('click', fecharRegiao);
  painelRegiao.querySelectorAll('.linha').forEach(b =>
    b.addEventListener('click', () => abrirCondo(r.id, +b.dataset.i)));
  ajustaCapa(r);
  ligaBarraRegiao();
  ligaAutoRolagem(painelRegiao.querySelector('.corpo'));
  const capa = painelRegiao.querySelector('.capa');
  if(capa && temMidia(r)) ligaLupa(capa, itensDeFotosEVideos(r.fotos, r.videos),
                                   r.nome, r.condado || '', '');
  const chip = painelRegiao.querySelector('.chip-raiox');
  if(chip) chip.addEventListener('click', () => abreRaioX(r));

  requestAnimationFrame(() => voaPara(centroDe(r.area), r.zoom || 11));
}

/* ── um campo só entra no mapa público depois de confirmado no admin ─────────
   Exceção: na PRÉVIA tudo aparece, senão você teria que confirmar às cegas. */
const EH_PREVIA = new URLSearchParams(location.search).get('dados') === 'previa';
function confirmado(obj, campo){
  if(EH_PREVIA) return true;
  return !(obj && Array.isArray(obj.aConfirmar) && obj.aConfirmar.indexOf(campo) >= 0);
}
function pegar(obj, campo, valor){
  return confirmado(obj, campo) ? valor : null;
}

/* A capa mostra só a foto do JPEG, cortada ANTES da onda — a onda agora é arte
   separada, desenhada por cima da emenda. A altura sai das dimensões reais da
   imagem, então funciona mesmo se a arte mudar de tamanho. */
/* Mostra a faixa do topo quando o nome da região sai de vista pelo alto.
   IntersectionObserver em vez de ouvir o scroll: não roda a cada pixel e o
   navegador avisa só na troca. Um observer novo por região — o painel é
   reconstruído a cada abertura e o anterior apontaria pra um nó morto. */
let olhoBarra = null;
function ligaBarraRegiao(){
  if(olhoBarra){ olhoBarra.disconnect(); olhoBarra = null; }
  const barra = painelRegiao.querySelector('.barra-reg');
  const alvo  = painelRegiao.querySelector('.grad-conteudo h2');
  const corpo = painelRegiao.querySelector('.corpo');
  if(!barra || !alvo || !corpo) return;
  barra.classList.remove('on');
  olhoBarra = new IntersectionObserver(([e]) => {
    /* só conta quando saiu POR CIMA; sair por baixo é o estado inicial */
    const acima = e.rootBounds && e.boundingClientRect.top < e.rootBounds.top;
    barra.classList.toggle('on', !e.isIntersecting && !!acima);
  }, {root: corpo, threshold: 0});
  olhoBarra.observe(alvo);
}

function ajustaCapa(regiao){
  const capa = painelRegiao.querySelector('.capa-corte');
  if(!capa) return;
  const foto = capa.querySelector('img');

  /* A caixa tem tamanho FIXO: a mesma altura da foto do condomínio, para os dois
     cabeçalhos ficarem iguais. Como as colunas têm larguras diferentes, a
     proporção da caixa da região sai dessa conta. Medimos a largura real da
     coluna do condomínio em vez de ler --painel: em telas estreitas essa
     variável vale "100%", e parseFloat devolveria 100 (px), achatando a caixa.

     Isto roda ANTES de a foto chegar, e é o que evita o painel carregar em duas
     etapas: o tamanho não depende da imagem, então reservar o espaço já aqui
     impede que a onda e todo o conteúdo abaixo pulem quando a foto entra. */
  const lReg  = capa.clientWidth || painelRegiao.offsetWidth;
  const lCon  = painelCondo.offsetWidth || lReg;
  const rCaixa = CONFIG.propFoto * (lReg / lCon);
  capa.style.aspectRatio = String(rCaixa);
  capa.style.setProperty('--pos-capa',  regiao.posFoto  || 'center top');
  capa.style.setProperty('--zoom-capa', regiao.zoomFoto || 1);

  if(!foto) return;
  /* some com o esqueleto assim que a foto resolve, de um jeito ou de outro */
  const paraDeCarregar = () => capa.classList.remove('carregando');
  foto.addEventListener('error', paraDeCarregar, {once:true});

  const aplica = () => {
    paraDeCarregar();
    if(regiao.zoomFoto) return;                 /* zoom escolhido no admin manda */
    if(!foto.naturalWidth || !foto.naturalHeight) return;
    const r = foto.naturalWidth / foto.naturalHeight;
    /* Cartão antigo da região (imagem em pé, 668×1705, com nome e números
       desenhados abaixo da foto): numa caixa desse formato apareceria também o
       texto da arte. Aproximamos o necessário para mostrar só a faixa de foto
       do topo (19% da altura). Foto comum não precisa de nada disso. */
    if(r < 1){
      capa.style.setProperty('--zoom-capa',
        Math.max(1, (r / rCaixa) / CONFIG.faixaFotoCartao));
    }
  };
  foto.complete ? aplica() : foto.addEventListener('load', aplica, {once:true});
}

/* Logos das lojas embutidos como data URI — evitam um arquivo pra hospedar
   e qualquer chance de 404. Trocar um logo = trocar a linha correspondente. */
/* qual logo usar: sai do nome real da loja, então a farmácia mostra Walgreens
   ou CVS conforme a que estiver mais perto. Usado no card e no pin do mapa. */
function chaveLogo(l){
  const n = (l.nome || '') + ' ' + (l.marca || '');
  return /cvs/i.test(n) ? 'cvs'
       : /walgreens/i.test(n) ? 'walgreens'
       : /publix/i.test(n) ? 'publix'
       : /walmart/i.test(n) ? 'walmart' : null;
}

/* ── A ONDA ───────────────────────────────────────────────────────────────
   A curva é descrita uma vez só, em coordenadas de 0 a 1 (proporção da caixa
   da foto), e serve pra duas coisas: recortar a foto e desenhar o traço branco.
   Como é proporcional, funciona em qualquer largura sem conta nenhuma.

   Para usar a SUA arte: mande o PNG e eu traço essa curva a partir dele —
   vira vetor, fica nítido em qualquer tela e o arquivo some do projeto. */
const ONDA = 'M0,0.929 C0.09,0.929 0.09,0.975 0.18,0.975 ' +
             'C0.265,0.975 0.265,0.987 0.35,0.987 ' +
             'C0.45,0.987 0.45,0.942 0.55,0.942 ' +
             'C0.65,0.942 0.65,0.877 0.75,0.877 ' +
             'C0.875,0.877 0.875,0.856 1,0.856';

/* o recorte da foto: tudo ACIMA da curva */
function defineRecorteDaOnda(){
  if(!CONFIG.onda || document.getElementById('ondaDefs')) return;
  const d = el('div');
  d.id = 'ondaDefs';
  d.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;';
  d.innerHTML = '<svg aria-hidden="true"><defs>'+
    '<clipPath id="ondaCorte" clipPathUnits="objectBoundingBox">'+
      '<path d="'+ONDA+' L1,0 L0,0 Z"/>'+
    '</clipPath></defs></svg>';
  document.body.appendChild(d);
}

/* o fio branco, desenhado exatamente sobre a borda do recorte */
function tracoDaOnda(){
  return '<svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+ONDA+'" fill="none" stroke="#fff" stroke-width="3" '+
    'vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';
}

/* a lupa da região só aparece se houver foto ou vídeo cadastrado pra ela —
   a imagem do topo é o JPEG do card antigo, que em tela cheia não serviria */
function temMidia(r){
  return ((r.fotos||[]).length + (r.videos||[]).length) > 0;
}

function htmlRegiao(r){
  const bullets = (r.destaques||[]).map(d => '<li>'+esc(d)+'</li>').join('');

  const numeros = (r.numeros||[]).map(n =>
    '<div class="num"><b>'+numeroRico(n.valor)+'</b><span>'+esc(n.rotulo)+'</span></div>').join('');

  /* ── linhas de condomínio, no formato do card original ── */
  const linhas = (r.condominios||[]).map((c,i) => {
    const meta = [];
    const f = c.ficha || {};
    const construtora = pegar(c,'ficha.construtora',f.construtora);
    const quartos = (pegar(c,'plantas',c.plantas)||[]).map(p=>p.quartos).filter(Boolean);
    if(quartos.length){
      const a = Math.min.apply(null,quartos), b = Math.max.apply(null,quartos);
      meta.push(icone.cama + (a===b ? a+' qt' : a+'-'+b+' qt'));
    }
    if(construtora) meta.push(icone.chave + '<i>' + esc(construtora) + '</i>');
    if(pegar(c,'ficha.entrega',f.entrega)) meta.push(icone.calendario + '<i>' + esc(f.entrega) + '</i>');

    return '<button type="button" class="linha" data-i="'+i+'">'+
      '<span class="linha-foto">'+(c.fotos && c.fotos[0]
        ? '<img src="'+esc(img(c.fotos[0]))+'" alt="" loading="lazy">' : '')+'</span>'+
      '<span class="linha-txt">'+
        '<span class="linha-nome">'+esc(c.nome)+'</span>'+
        (c.chamadas && c.chamadas.length
          ? '<span class="linha-chamadas">'+c.chamadas.map(esc).join('<br>')+'</span>' : '')+
        (c.precoBase ? '<span class="linha-preco"><small>A partir de</small><b>'+esc(c.precoBase)+'</b></span>' : '')+
        (meta.length ? '<span class="linha-meta">'+meta.map(m=>'<span>'+m+'</span>').join('')+'</span>' : '')+
      '</span></button>';
  }).join('');

  const zap = whatsapp(DADOS.whatsapp,
    '👋 Olá Maqueli! Vi o mapa no site e quero saber mais sobre a região de '+r.nome+'.');

  const blocoCondos = linhas
    ? '<div class="linhas">'+linhas+'</div>'
    : '<div class="aviso">'+icone.vazio+
      '<p>Os condomínios desta região estão sendo atualizados. Fale com a Maqueli para receber as opções disponíveis hoje.</p>'+
      '<a href="'+esc(zap)+'" target="_blank" rel="noopener">Falar no WhatsApp</a></div>';

  /* ── seções extras da região, abaixo dos condomínios ── */
  const escolas = (pegar(r,'escolas',r.escolas)||[]).map(e =>
    '<div class="par"><span>'+esc(e.nome)+
      (e.nivel ? '<small>'+esc(e.nivel)+'</small>' : '')+'</span><i></i>'+
    '<span>'+esc(e.nota||'')+'</span></div>').join('');

  const custos = (pegar(r,'custos',r.custos)||[]).map(c =>
    '<div class="par"><span>'+esc(c.item)+'</span><i></i><span>'+esc(c.valor)+'</span></div>').join('');

  const lugares = (pegar(r,'lugares',r.lugares)||[]).map(l =>
    '<div class="par"><span>'+esc(l.nome)+
      (l.tipo ? '<small>'+esc(l.tipo)+'</small>' : '')+'</span><i></i>'+
    '<span>'+esc(l.distancia||'')+'</span></div>').join('');

  const perfil = pegar(r,'perfil',r.perfil);
  const bloco = (titulo, conteudo, classe) => conteudo
    ? '<div class="secao"><h3 class="secao-tit">'+titulo+'</h3><div class="'+(classe||'pares')+'">'+conteudo+'</div></div>' : '';

  return ''+
  '<button class="fechar" aria-label="Fechar região">'+icone.x+'</button>'+
  '<div class="barra-reg" aria-hidden="true"><b>'+esc(r.nome)+'</b>'+
    (r.condado ? '<span>'+esc(r.condado)+'</span>' : '')+'</div>'+
  '<div class="corpo">'+
    '<section class="grad">'+
      /* região ainda sem foto de card: o bloco some inteiro em vez de pedir
         uma imagem que não existe e mostrar o ícone de quebrado */
      (r.foto
        ? '<header class="capa'+(CONFIG.onda ? ' com-onda' : '')+'">'+
            '<div class="capa-corte carregando"><img src="'+esc(img(r.foto))+'" alt="'+esc(r.nome)+'"></div>'+
            (CONFIG.onda ? '<div class="onda-fio">'+tracoDaOnda()+'</div>' : '')+
            /* topo.png é a onda nova; se CONFIG.onda voltar a ligar, quem manda
               é o clip-path antigo — as duas juntas dariam onda dupla. */
            (!CONFIG.onda ? '<div class="topo-onda"><img src="'+TOPO_ONDA+'" alt=""></div>' : '')+
            (temMidia(r) ? '<button class="gc-abrir" aria-label="Ver fotos e vídeos da região">'+icone.expandir+'</button>' : '')+
          '</header>'
        : '')+
      '<div class="grad-conteudo">'+
      '<h2>'+esc(r.nome)+'</h2>'+
      (r.condado ? '<p class="condado">'+esc(r.condado)+'</p>' : '')+
      (r.resumo ? '<p class="resumo">'+esc(r.resumo)+'</p>' : '')+
      (bullets ? '<ul class="bullets">'+bullets+'</ul>' : '')+

/* recebe o estado pronto — quem chama é que sabe se o condomínio segue aceso */
function destacaCondo(i, aceso){
  if(i == null) return;
  const b = painelRegiao.querySelector('.linha[data-i="'+i+'"]');
  if(b) b.classList.toggle('ativo', !!aceso);
  const p = pins[i];
  if(p) p.no.classList.toggle('ativo', !!aceso);
}

function abrirCondo(regiaoId, i){
  const r = DADOS.regioes.find(x => x.id === regiaoId);
  if(!r) return;
  if(!regiaoAtual || regiaoAtual.id !== regiaoId){ abrirRegiao(regiaoId); }
  const c = r.condominios[i];
  if(!c) return;

  destacaCondo(condoAtual, false);
  condoAtual = i;

  painelCondo.innerHTML = htmlCondo(r, c);
  painelCondo.classList.add('aberto');
  painelCondo.setAttribute('aria-hidden','false');
  sinalizaPaineis();
  painelCondo.querySelector('.corpo').scrollTop = 0;
  painelCondo.querySelector('.fechar').addEventListener('click', () => fecharCondo());
  painelCondo.querySelector('.voltar').addEventListener('click', () => fecharCondo());
  const bv = painelCondo.querySelector('.btn-video');
  if(bv) bv.addEventListener('click', () => abrirVideo(bv.dataset.video));
  limpaLojasDoMapa();
  const bm = painelCondo.querySelector('.bt-mapa');
  if(bm) bm.addEventListener('click', () => mostraLojasNoMapa(c));

  iniciaGaleria();
  ajustaCapaProvisoria();
  ligaGaleriaCheia(c, r);
  ligaAutoRolagem(painelCondo.querySelector('.corpo'));
  destacaCondo(i, true);

  /* quando a região é aberta junto, o voo dela fica agendado num requestAnimationFrame;
     agendamos o nosso logo depois pra não sermos sobrescritos por ele. Guardo o id
     porque "Ver no mapa" precisa cancelar este voo: se ele disparar depois do
     enquadramento das lojas, joga a câmera de volta no condomínio e os pins somem. */
  const alvo = c.pin || centroDe(r.area);
  vooCondo = requestAnimationFrame(() => map.flyTo({
    center:alvo, zoom:Math.max((r.zoom||11)+1.1, 12.4), padding:folga(), duration:900
  }));
}

   o mesmo recorte do cabeçalho dela. O JPEG é o card antigo inteiro — sem o
   recorte apareceria o gradiente e os textos do card, não uma foto. Sem lupa:
   não há galeria para abrir. Assim que o condomínio ganhar fotos, some sozinha. */
function capaDaRegiao(r){
  if(!r.foto) return '';
  return '<header class="galeria provisoria"><div class="capa-corte">'+
           '<img src="'+esc(img(r.foto))+'" alt="'+esc(r.nome)+'">'+
         '</div></header>';
}

function ajustaCapaProvisoria(){
  const capa = painelCondo.querySelector('.galeria.provisoria .capa-corte');
  const foto = capa && capa.querySelector('img');
  if(!foto) return;
  const aplica = () => {
    if(!foto.naturalWidth || !foto.naturalHeight) return;
    /* faixa visível = larguraNatural / (proporção × zoom × alturaNatural) */
    const z = foto.naturalWidth /
              (CONFIG.propFoto * CONFIG.corteSemOnda * foto.naturalHeight);
    capa.style.setProperty('--zoom', (z*100)+'%');
  };
  foto.complete ? aplica() : foto.addEventListener('load', aplica, {once:true});
}

function iniciaGaleria(){
  if(slideTimer){ clearInterval(slideTimer); slideTimer = null; }
  const g = painelCondo.querySelector('.galeria');
  const fotos = g ? g.querySelectorAll('img') : [];
  if(fotos.length < 2) return;
  const pontos = g.querySelectorAll('.galeria-pontos button');
  let k = 0;
  const mostra = n => {
    fotos[k].classList.remove('on'); if(pontos[k]) pontos[k].classList.remove('on');
    k = (n + fotos.length) % fotos.length;
    fotos[k].classList.add('on');    if(pontos[k]) pontos[k].classList.add('on');
  };
  pontos.forEach((p,n) => p.addEventListener('click', () => { mostra(n); reinicia(); }));
  function reinicia(){
    if(slideTimer) clearInterval(slideTimer);
    slideTimer = setInterval(() => mostra(k+1), 4200);
  }
  g.addEventListener('mouseenter', () => { if(slideTimer){ clearInterval(slideTimer); slideTimer = null; } });
  g.addEventListener('mouseleave', reinicia);
  reinicia();
}


/* ============================================================
   LOJAS NO MAPA
   ============================================================ */
const COR_LOJA = {'Walmart':'#1a6ad4', 'Publix':'#1f8f3e', 'Farmácia':'#d62828'};
let pinsLoja = [];
let vooCondo = 0;   /* requestAnimationFrame do voo até o condomínio */

const ROTA = 'rotas-loja';
const VAZIO = {type:'FeatureCollection', features:[]};

function limpaLojasDoMapa(){
  pinsLoja.forEach(m => m.remove());
  pinsLoja = [];
  const fonte = map.getSource(ROTA);
  if(fonte) fonte.setData(VAZIO);
  const b = painelCondo.querySelector('.bt-mapa');
  if(b) b.classList.remove('ativo');
}

/* Liga o condomínio a cada loja: risco de 2px na cor do pin e o tempo no meio */
function ligaLojas(origem, lojas){
  const dados = {type:'FeatureCollection', features: lojas.map(l => ({
    type:'Feature',
    properties:{cor: COR_LOJA[l.marca] || '#d62828'},
    geometry:{type:'LineString', coordinates:[origem, l.pin]}
  }))};

  const fonte = map.getSource(ROTA);
  if(fonte){ fonte.setData(dados); }
  else {
    map.addSource(ROTA, {type:'geojson', data:dados});
    map.addLayer({id:ROTA, type:'line', source:ROTA,
                  layout:{'line-cap':'round'},
                  paint:{'line-color':['get','cor'], 'line-width':2}});
  }

  /* mercator y cresce pra baixo igual à tela, então a perpendicular calculada
     aqui é a mesma na tela: encosto a etiqueta ao lado da linha em vez de em
     cima dela, senão ela cai bem no alfinete de outra loja */
  const my = v => { const t = Math.sin(v * Math.PI / 180);
                    return 0.5 - Math.log((1 + t) / (1 - t)) / (4 * Math.PI); };

  lojas.forEach(l => {
    const dx = (l.pin[0] - origem[0]) / 360, dy = my(l.pin[1]) - my(origem[1]);
    const d = Math.hypot(dx, dy) || 1;
    const t = el('div','tempo-loja');
    t.style.color = COR_LOJA[l.marca] || '#d62828';
    t.textContent = l.minutos + ' min';
    pinsLoja.push(new mapboxgl.Marker({element:marcador(t), anchor:'center',
                                       offset:[-dy / d * 15, dx / d * 15]})
      .setLngLat([(origem[0] + l.pin[0]) / 2, (origem[1] + l.pin[1]) / 2]).addTo(map));
  });
}

/* Câmera que põe TODOS os pontos dentro da faixa de mapa que os painéis não
   cobrem. `recuo` afasta um pouco mais, usado pela rede de segurança abaixo.

   Não uso fitBounds: ele enquadra na caixa inteira e o `padding` dele briga com
   o padding que o flyTo dos painéis já deixou gravado na câmera — dá zoom certo
   com centro errado, e os pins caem atrás do painel ou fora da tela. */
function cameraPara(pontos, recuo){
  const caixa = map.getContainer();
  const L = caixa.clientWidth, A = caixa.clientHeight;
  const f = folga();

  /* o alfinete tem 30px e ainda leva o chip do logo por cima (23px + folga),
     e o chip chega a 89px de largura. Reservo o desenho inteiro, não só a ponta. */
  let x0 = f.left + 50, x1 = L - f.right - 50,
      y0 = f.top + 68,  y1 = A - f.bottom - 16;
  if(x1 - x0 < 120){ x1 = L - 10; x0 = Math.max(10, x1 - 120); }  /* painel comeu tudo */
  if(y1 - y0 < 120){ y0 = 10; y1 = Math.min(A - 10, 130); }

  /* Web Mercator normalizado (0..1) */
  const mx = u => (u + 180) / 360;
  const my = v => { const s = Math.sin(v * Math.PI / 180);
                    return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };

  const xs = pontos.map(p => mx(p[0])), ys = pontos.map(p => my(p[1]));
  const ax = Math.min.apply(null, xs), bx = Math.max.apply(null, xs);
  const ay = Math.min.apply(null, ys), by = Math.max.apply(null, ys);

  /* zoom que cabe: tile do Mapbox tem 512px */
  const cabe = (vao, px) => vao <= 1e-9 ? 20 : Math.log2(px / (512 * vao));
  let zoom = Math.min(cabe(bx - ax, x1 - x0), cabe(by - ay, y1 - y0), 14)
             - 0.25 - (recuo || 0);
  zoom = Math.max(3, zoom);

  /* Onde o centro da câmera tem que ficar pra que o meio do retângulo dos pontos
     caia no meio da área livre. Faço a conta em Mercator em vez de usar `offset`
     do Mapbox: o offset dele parte do centro JÁ deslocado pelo padding gravado
     na câmera, e o desvio entrava duas vezes. */
  const esc = 512 * Math.pow(2, zoom);
  const cxm = (ax + bx) / 2 - ((x0 + x1) / 2 - L / 2) / esc;
  const cym = (ay + by) / 2 - ((y0 + y1) / 2 - A / 2) / esc;

  return {zoom:zoom, ret:[x0, y0, x1, y1],
          centro:[ cxm * 360 - 180,
                   Math.atan(Math.sinh(Math.PI * (1 - 2 * cym))) * 180 / Math.PI ]};
}

const SEM_FOLGA = {top:0, right:0, bottom:0, left:0};

function cabemTodos(pontos, ret){
  return pontos.every(p => {
    const q = map.project(p);
    return q.x >= ret[0] && q.x <= ret[2] && q.y >= ret[1] && q.y <= ret[3];
  });
}

function enquadraPontos(pontos){
  if(!pontos.length) return;
  const cam = cameraPara(pontos, 0);
  map.easeTo({center:cam.centro, zoom:cam.zoom, padding:SEM_FOLGA,
              duration:900, essential:true});

  /* rede de segurança: se ainda sobrar pin fora — painel que mudou de largura no
     meio do voo, janela redimensionada, alfinete maior que o previsto — recua
     mais até TODOS caberem. Com a conta certa isso não roda nenhuma vez. */
  map.once('moveend', () => {
    for(let r = 0.25; r <= 3 && !cabemTodos(pontos, cam.ret); r += 0.25){
      const c = cameraPara(pontos, r);
      map.jumpTo({center:c.centro, zoom:c.zoom, padding:SEM_FOLGA});
    }
  });
}

function mostraLojasNoMapa(c){
  cancelAnimationFrame(vooCondo);   /* senão ele voa depois e desfaz o enquadramento */
  limpaLojasDoMapa();
  const lojas = (pegar(c,'lojas',c.lojas)||[]).filter(l => l.pin);
  if(!lojas.length) return;

  /* linhas e etiquetas de tempo primeiro: assim os alfinetes ficam por cima */
  if(c.pin) ligaLojas(c.pin, lojas);

  lojas.forEach(l => {
    const cor = COR_LOJA[l.marca] || '#d62828';
    const n = el('div','pin-loja');
    const k = chaveLogo(l);
    n.innerHTML =
      (k ? '<span class="chip-loja chip-'+k+'"><img src="'+LOGOS[k]+'" alt="'+esc(l.marca)+'"></span>'
         : '<span class="chip-loja"><b>'+esc(l.marca)+'</b></span>')+
      '<svg viewBox="0 0 24 24"><path fill="'+cor+'" '+
        'd="M12 23s7.3-7.6 7.3-13A7.3 7.3 0 0 0 4.7 10c0 5.4 7.3 13 7.3 13z"/>'+
        '<circle cx="12" cy="9.8" r="2.6" fill="#fff"/></svg>';
    pinsLoja.push(new mapboxgl.Marker({element:marcador(n), anchor:'bottom'})
      .setLngLat(l.pin).addTo(map));
  });

  const pontos = lojas.map(l => l.pin);
  if(c.pin) pontos.push(c.pin);
  enquadraPontos(pontos);
  const b = painelCondo.querySelector('.bt-mapa');
  if(b) b.classList.add('ativo');
}

/* ============================================================
   GALERIA EM TELA CHEIA
   ============================================================ */
/* A galeria trabalha com ITENS, não só fotos: cada um é
   {tipo:'foto', src} ou {tipo:'video', id}. É o que permite misturar as duas
   coisas na mesma tira, na região e no condomínio. */
let gcItens = [], gcIndice = 0, gcNome = '', gcLocal = '', gcPreco = '';

function itensDeFotosEVideos(fotos, videos){
  const itens = (fotos||[]).map(f => ({tipo:'foto', src: img(f)}));
  (videos||[]).forEach(v => {
    const id = idYoutube(v);
    if(id) itens.push({tipo:'video', id: id});
  });
  return itens;
}

/* liga o clique da foto (do painel da região ou do condomínio) na galeria */
function ligaLupa(alvo, itens, nome, local, preco){
  if(!itens.length) return;
  const abre = () => {
    gcItens = itens; gcNome = nome || ''; gcLocal = local || ''; gcPreco = preco || '';
    const atual = [...alvo.querySelectorAll('img')].findIndex(x => x.classList.contains('on'));
    abreGaleriaCheia(Math.max(atual, 0));
  };
  alvo.classList.add('tem-lupa');
  alvo.addEventListener('click', e => {
    if(e.target.closest('.galeria-pontos')) return;
    abre();
  });
}

function ligaGaleriaCheia(c, r){
  const g = painelCondo.querySelector('.galeria');
  if(g) ligaLupa(g, itensDeFotosEVideos(c.fotos, []), c.nome,
                 [r && r.nome, r && r.condado].filter(Boolean).join(' · '), c.precoBase);
}

function abreGaleriaCheia(i){
  if(!gcItens.length) return;
  if(slideTimer){ clearInterval(slideTimer); slideTimer = null; }   /* pausa o slide do painel */
  $('#gcTitulo').textContent = gcNome;
  $('#gcLocal').textContent = gcLocal;
  $('#gcPreco').hidden = !gcPreco;
  $('#gcValor').textContent = gcPreco;
  const tira = $('#gcTira');
  tira.textContent = '';
  gcItens.forEach((it, k) => {
    const b = el('button', it.tipo === 'video' ? 'video' : '');
    b.type = 'button';
    b.setAttribute('aria-label', (it.tipo === 'video' ? 'Vídeo ' : 'Foto ') + (k + 1));
    const capa = it.tipo === 'video'
      ? 'https://img.youtube.com/vi/' + it.id + '/hqdefault.jpg'
      : it.src;
    b.innerHTML = '<img src="' + esc(capa) + '" alt="" loading="lazy">';
    b.addEventListener('click', () => mostraGaleriaCheia(k));
    tira.appendChild(b);
  });
  $('#galeriaCheia').hidden = false;
  document.body.style.overflow = 'hidden';
  mostraGaleriaCheia(i);
}

/* 125% do arquivo, ou o que couber na tela, o que for menor */
function dimensionaFoto(){
  const f = $('#gcFoto'), v = $('#gcVideo');
  const tela = $('#galeriaCheia');
  const cromo = $('.gc-topo').offsetHeight + ($('#gcTira').hidden ? 0 : $('#gcTira').offsetHeight);
  const cx = tela.clientWidth  - 40;
  const cy = tela.clientHeight - 40 - cromo;
  if(!v.hidden){                                   /* vídeo: sempre 16/9 */
    const k = Math.min(cx / 16, cy / 9);
    v.style.width  = Math.round(16 * k) + 'px';
    v.style.height = Math.round(9 * k) + 'px';
    return;
  }
  if(!f.naturalWidth || !f.naturalHeight) return;
  const k = Math.min(1.25, cx / f.naturalWidth, cy / f.naturalHeight);
  f.style.width  = Math.round(f.naturalWidth  * k) + 'px';
  f.style.height = Math.round(f.naturalHeight * k) + 'px';
}

function mostraGaleriaCheia(i){
  gcIndice = (i + gcItens.length) % gcItens.length;
  const it = gcItens[gcIndice];
  const f = $('#gcFoto'), v = $('#gcVideo'), ifr = $('#gcIframe');
  if(it.tipo === 'video'){
    f.hidden = true; f.src = '';
    v.hidden = false;
    ifr.src = 'https://www.youtube.com/embed/' + it.id + '?rel=0';
  } else {
    v.hidden = true; ifr.removeAttribute('src');   /* src='' viraria a URL da página e o vídeo seguiria tocando */
    f.hidden = false;
    f.style.width = f.style.height = '';
    f.addEventListener('load', dimensionaFoto, {once:true});
    f.src = it.src;
    f.alt = gcNome + ' — foto ' + (gcIndice + 1);
    if(f.complete) dimensionaFoto();
  }
  dimensionaFoto();
  $('#gcContador').textContent = (gcIndice + 1) + ' / ' + gcItens.length;
  const bs = [...$('#gcTira').children];
  bs.forEach((b, k) => b.classList.toggle('on', k === gcIndice));
  if(bs[gcIndice]) bs[gcIndice].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  const unico = gcItens.length < 2;
  $('#gcAnt').hidden = unico;
  $('#gcProx').hidden = unico;
  $('#gcTira').hidden = unico;
}

function fechaGaleriaCheia(){
  $('#galeriaCheia').hidden = true;
  $('#gcFoto').src = '';
  $('#gcIframe').removeAttribute('src');
  document.body.style.overflow = '';
  iniciaGaleria();                 /* devolve o slide do painel */
}

$('#gcFechar').addEventListener('click', fechaGaleriaCheia);
$('#gcAnt').addEventListener('click', () => mostraGaleriaCheia(gcIndice - 1));
$('#gcProx').addEventListener('click', () => mostraGaleriaCheia(gcIndice + 1));
$('#galeriaCheia').addEventListener('click', e => {
  if(e.target.id === 'galeriaCheia' || e.target.classList.contains('gc-palco')) fechaGaleriaCheia();
});

/* ============================================================
   VÍDEO
   ============================================================ */
function abrirVideo(id){
  $('#videoFrame').src = 'https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';
  $('#lightbox').classList.add('on');
}
function fecharVideo(){
  $('#lightbox').classList.remove('on');
  $('#videoFrame').src = '';
}
$('#btFecharVideo').addEventListener('click', fecharVideo);
$('#lightbox').addEventListener('click', e => { if(e.target.id === 'lightbox') fecharVideo(); });

/* ============================================================
   CONTROLES GERAIS
   ============================================================ */
$('#btReset').addEventListener('click', () => { fecharVideo(); fecharRegiao(); $('#busca').value=''; $('#busca').dispatchEvent(new Event('input')); });

/* Abrir em nova janela: aponta pro próprio endereço do mapa, então funciona
   igual embutido em iframe (abre fora dele) ou aberto direto. */
$('#btNovaJanela').href = location.href;

/* Selo de direitos colado à esquerda da atribuição do Mapbox. Entra depois que
   o mapa monta os controles; a atribuição do Mapbox continua intacta ao lado. */
function poeSeloDireitos(){
  const canto = document.querySelector('.mapboxgl-ctrl-bottom-right');
  if(!canto || document.getElementById('selo-direitos')) return;
  const selo = document.createElement('div');
  selo.id = 'selo-direitos';
  selo.textContent = 'Esse mapa é conteúdo registrado e exclusivo para uso de ' +
                     'Maqueli Florida e seus licenciados.';
  canto.insertBefore(selo, canto.firstChild);
}
$('#btMais').addEventListener('click',  () => map.zoomTo(map.getZoom()+.6, {duration:280}));
$('#btMenos').addEventListener('click', () => map.zoomTo(map.getZoom()-.6, {duration:280}));
document.addEventListener('keydown', e => {
  if(!$('#raioX').hidden && $('#galeriaCheia').hidden){
    if(e.key === 'Escape') fechaRaioX();
    return;
  }
  if(!$('#galeriaCheia').hidden){
    if(e.key === 'Escape') fechaGaleriaCheia();
    else if(e.key === 'ArrowLeft')  mostraGaleriaCheia(gcIndice - 1);
    else if(e.key === 'ArrowRight') mostraGaleriaCheia(gcIndice + 1);
    return;
  }
  if(e.key !== 'Escape') return;
  if($('#lightbox').classList.contains('on')) fecharVideo();
  else if(painelCondo.classList.contains('aberto')) fecharCondo();
  else if(painelRegiao.classList.contains('aberto')) fecharRegiao();
});
document.querySelectorAll('[data-parque]').forEach(b => b.addEventListener('click', () => {
  const p = DADOS.parques && DADOS.parques[b.dataset.parque];
  if(!p || !p.area) return;
  fecharRegiao();
  setTimeout(() => map.flyTo({center:centroDe(p.area), zoom:12.4, duration:900}), 60);
}));
window.addEventListener('resize', () => { if(map) map.resize(); if(!$('#galeriaCheia').hidden) dimensionaFoto(); });

/* ============================================================
   PARTIDA
   ============================================================ */
carregarDados().then(d => {
  DADOS = d;
  if(EH_PREVIA) $('#selo-previa').hidden = false;
  defineRecorteDaOnda();
  montaMenu();
  iniciaMapa();
}).catch(e => {
  console.error('Não foi possível iniciar o mapa:', e);
  $('#lista').innerHTML = '<p class="item-vazio">Não foi possível carregar os dados.</p>';
});

})();
</script>
